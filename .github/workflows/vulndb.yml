# Atualiza data/vulndb.json (CVEs + ciclo de vida dos SGBDs) toda semana e faz commit direto na main.
# Os servidores do analisador baixam esse arquivo com "php bin/console vulndb:update" (cron semanal).
name: Atualizar base de vulnerabilidades

on:
  schedule:
    - cron: '17 6 * * 1'   # segunda, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vulndb
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - run: python3 tools/build_vulndb.py --cache "$RUNNER_TEMP/vulndb-cache"
      - name: Commit se mudou
        run: |
          if git diff --quiet -- data/vulndb.json; then echo "Sem mudanças"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/vulndb.json
          git commit -m "chore(vulndb): atualiza base de CVEs e ciclo de vida"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 5; done
          exit 1
