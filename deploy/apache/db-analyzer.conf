# DB Oráculo Analyzer — VirtualHost Apache2 (gerado pelo install.sh)
# Placeholders substituídos pelo instalador: __SERVER_NAME__ __APP_DIR__ __PHP_SOCK__ __CERT__ __KEY__

<VirtualHost *:80>
    ServerName __SERVER_NAME__
    # Mantém o desafio ACME (certbot) acessível e redireciona o resto para HTTPS
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
    DocumentRoot __APP_DIR__/public
</VirtualHost>

<VirtualHost *:443>
    ServerName __SERVER_NAME__
    DocumentRoot __APP_DIR__/public

    SSLEngine on
    SSLCertificateFile    __CERT__
    SSLCertificateKeyFile __KEY__
    Protocols h2 http/1.1

    <Directory __APP_DIR__/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
        FallbackResource /index.php
    </Directory>

    # Nada fora de /public é servido; reforço explícito
    <DirectoryMatch "^__APP_DIR__/(app|bin|database|deploy|storage|\.git)">
        Require all denied
    </DirectoryMatch>
    <FilesMatch "\.(sqlite|sqlite3|db|sql|md|sh|ini|log|bak)$">
        Require all denied
    </FilesMatch>

    # PHP-FPM
    <FilesMatch "^index\.php$">
        SetHandler "proxy:unix:__PHP_SOCK__|fcgi://localhost"
    </FilesMatch>
    <FilesMatch "\.php$">
        Require all denied
    </FilesMatch>
    <Files "index.php">
        Require all granted
    </Files>

    # Cabeçalhos de segurança
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "same-origin"
    Header always set Permissions-Policy "geolocation=(), camera=(), microphone=()"
    Header always unset X-Powered-By
    ServerSignature Off

    # Cache de estáticos (versionados via ?v=)
    <LocationMatch "^/assets/">
        Header set Cache-Control "public, max-age=2592000, immutable"
    </LocationMatch>

    # Análises com IA podem demorar
    ProxyTimeout 300
    LimitRequestBody 2097152

    ErrorLog  ${APACHE_LOG_DIR}/db-analyzer-error.log
    CustomLog ${APACHE_LOG_DIR}/db-analyzer-access.log combined
</VirtualHost>
